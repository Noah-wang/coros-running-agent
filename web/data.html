<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COROS Running Agent · Data</title>
    <link rel="icon" type="image/png" href="/assets/coros-running-agent-avatar.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="data-page">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <img src="/assets/coros-running-agent-avatar.png" alt="">
        </span>
        <h1>COROS Running Agent</h1>
      </div>
      <nav class="topnav">
        <a href="/" data-i18n="nav.chat">Chat</a>
        <a href="/data" class="active" aria-current="page" data-i18n="nav.data">Data</a>
        <a href="/tech" data-i18n="nav.tech">Tech</a>
        <a href="/settings" data-i18n="nav.settings">Settings</a>
      </nav>
    </header>

    <main class="data-shell">
      <section class="data-hero" aria-labelledby="dataTitle">
        <div>
          <p class="eyebrow" data-i18n="data.eyebrow">Personal Agent Data</p>
          <h2 id="dataTitle" data-i18n="data.title">Your Agent Memory</h2>
          <p data-i18n="data.subtitle">
            This page shows data that the public web console can read: PBs, running knowledge,
            COROS archives, and route assets. The public web surface is read-only; writes still happen through Discord.
          </p>
        </div>
        <a class="primary-link" href="/" data-i18n="data.back">Back to chat</a>
      </section>

      <section class="metric-strip" id="metricStrip" data-i18n-aria="data.overview" aria-label="Data overview"></section>

      <nav class="data-tabs" id="dataTabs" data-i18n-aria="data.categories" aria-label="Data categories"></nav>

      <section class="data-board" id="dataBoard" aria-live="polite"></section>
    </main>

    <script src="/data.js" type="module"></script>
  </body>
</html>

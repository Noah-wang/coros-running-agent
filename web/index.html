<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COROS Running Agent</title>
    <link rel="icon" type="image/png" href="/assets/coros-running-agent-avatar.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <img src="/assets/coros-running-agent-avatar.png" alt="">
        </span>
        <h1>COROS Running Agent</h1>
      </div>
      <nav class="topnav">
        <a href="/" class="active" aria-current="page">对话</a>
        <a href="/data">数据</a>
        <a href="/tech">技术</a>
      </nav>
    </header>

    <main class="workspace">
      <aside class="rail" aria-label="对话列表">
        <button type="button" id="newChat" class="new-thread-button">新建对话</button>
        <div class="conversation-list" id="conversationList"></div>

        <section class="flowmap" id="flowMap" aria-label="本次调用链路">
          <h2 class="rail-title">调用链路</h2>
          <svg viewBox="0 0 320 400" role="img" aria-hidden="true">
            <defs>
              <marker id="flowArrow" viewBox="0 0 8 8" refX="6" refY="4"
                      markerWidth="5" markerHeight="5" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
              </marker>
            </defs>

            <g class="flow-wires">
              <path class="flow-edge" data-from="entry" data-to="router" d="M160 36 V56" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="entry" data-to="loop" d="M124 29 C80 42 58 76 70 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="router" data-to="loop" d="M118 76 C91 82 76 94 72 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="router" data-to="capability" d="M202 76 C229 82 244 94 248 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="profile" d="M72 142 C56 151 48 164 50 184" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="knowledge" d="M86 142 C112 162 129 185 141 220" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="search" d="M61 142 C35 174 33 221 50 260" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="capability" data-to="langgraph" d="M248 142 V170" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="langgraph" data-to="coros" d="M248 202 V228" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="coros" data-to="observation" d="M206 244 C187 246 177 252 170 266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="profile" data-to="observation" d="M90 200 C118 210 141 231 153 266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="knowledge" data-to="observation" d="M145 252 V266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="search" data-to="observation" d="M90 276 C112 277 133 275 145 274" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="observation" data-to="llm" d="M160 298 V316" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="llm" data-to="reflection" d="M160 344 V356" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="reflection" data-to="answer" d="M202 370 H230" marker-end="url(#flowArrow)"/>
            </g>

            <g class="flow-node" data-module="entry">
              <rect x="118" y="8" width="84" height="28" rx="8"/>
              <text x="160" y="26">入口</text>
            </g>
            <g class="flow-node" data-module="router">
              <rect x="118" y="56" width="84" height="28" rx="8"/>
              <text x="160" y="74">语义路由</text>
            </g>
            <g class="flow-node" data-module="loop">
              <rect x="32" y="112" width="86" height="30" rx="8"/>
              <text x="75" y="131">主循环</text>
            </g>
            <g class="flow-node" data-module="capability">
              <rect x="202" y="112" width="92" height="30" rx="8"/>
              <text x="248" y="131">能力层</text>
            </g>
            <g class="flow-node" data-module="langgraph">
              <rect x="202" y="172" width="92" height="30" rx="8"/>
              <text x="248" y="191">LangGraph</text>
            </g>

            <g class="flow-node" data-module="coros">
              <rect x="202" y="230" width="92" height="30" rx="8"/>
              <text x="248" y="249">COROS MCP</text>
            </g>
            <g class="flow-node" data-module="profile">
              <rect x="16" y="184" width="86" height="30" rx="8"/>
              <text x="59" y="203">长期档案</text>
            </g>
            <g class="flow-node" data-module="knowledge">
              <rect x="108" y="222" width="86" height="30" rx="8"/>
              <text x="151" y="241">RAG</text>
            </g>
            <g class="flow-node" data-module="search">
              <rect x="16" y="260" width="86" height="30" rx="8"/>
              <text x="59" y="279">搜索</text>
            </g>
            <g class="flow-node" data-module="observation">
              <rect x="106" y="268" width="108" height="30" rx="8"/>
              <text x="160" y="287">Observation</text>
            </g>
            <g class="flow-node" data-module="llm">
              <rect x="118" y="316" width="84" height="28" rx="8"/>
              <text x="160" y="334">LLM 生成</text>
            </g>

            <g class="flow-node" data-module="reflection">
              <rect x="112" y="356" width="96" height="28" rx="8"/>
              <text x="160" y="374">反思检查</text>
            </g>

            <g class="flow-node" data-module="answer">
              <rect x="230" y="356" width="72" height="28" rx="8"/>
              <text x="266" y="374">回答</text>
            </g>
          </svg>
          <p class="flow-hint" id="flowHint">提问后节点会在图上亮起</p>
        </section>
      </aside>

      <section class="chat-shell">
        <div class="stage">
          <div class="thread" id="chatLog" aria-live="polite">
            <section class="welcome" id="welcome">
              <h2>COROS Running Agent</h2>
              <p>这个网页可以查询运动记录、PB、跑步知识库和 COROS 归档数据；写入操作只在 Discord 里开放。</p>
            </section>
          </div>
        </div>

        <section class="composer-suggestions" aria-label="快捷问题">
          <div class="suggestions" id="suggestions"></div>
        </section>

        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput">消息</label>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="输入问题，或点击上方快捷问题填入……"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" aria-label="发送">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>

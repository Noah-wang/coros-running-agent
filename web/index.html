<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COROS Running Agent</title>
    <link rel="icon" type="image/png" href="/assets/coros-running-agent-avatar.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <img src="/assets/coros-running-agent-avatar.png" alt="">
        </span>
        <h1>COROS Running Agent</h1>
      </div>
      <nav class="topnav">
        <a href="/" class="active" aria-current="page" data-i18n="nav.chat">Chat</a>
        <a href="/data" data-i18n="nav.data">Data</a>
        <a href="/tech" data-i18n="nav.tech">Tech</a>
      </nav>
    </header>

    <main class="workspace">
      <aside class="rail" data-i18n-aria="chat.conversationList" aria-label="Conversation list">
        <button type="button" id="newChat" class="new-thread-button" data-i18n="chat.newChat">New chat</button>
        <div class="conversation-list" id="conversationList"></div>

        <section class="flowmap" id="flowMap" data-i18n-aria="flow.title" aria-label="Execution trace">
          <h2 class="rail-title" data-i18n="flow.title">Execution trace</h2>
          <svg viewBox="0 0 320 400" role="img" aria-hidden="true">
            <defs>
              <marker id="flowArrow" viewBox="0 0 8 8" refX="6" refY="4"
                      markerWidth="5" markerHeight="5" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
              </marker>
            </defs>

            <g class="flow-wires">
              <path class="flow-edge" data-from="entry" data-to="router" d="M160 36 V56" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="entry" data-to="loop" d="M124 29 C80 42 58 76 70 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="router" data-to="loop" d="M118 76 C91 82 76 94 72 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="router" data-to="capability" d="M202 76 C229 82 244 94 248 110" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="profile" d="M72 142 C56 151 48 164 50 184" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="knowledge" d="M86 142 C112 162 129 185 141 220" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="loop" data-to="search" d="M61 142 C35 174 33 221 50 260" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="capability" data-to="langgraph" d="M248 142 V170" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="langgraph" data-to="coros" d="M248 202 V228" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="coros" data-to="observation" d="M206 244 C187 246 177 252 170 266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="profile" data-to="observation" d="M90 200 C118 210 141 231 153 266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="knowledge" data-to="observation" d="M145 252 V266" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="search" data-to="observation" d="M90 276 C112 277 133 275 145 274" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="observation" data-to="llm" d="M160 298 V316" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="llm" data-to="reflection" d="M160 344 V356" marker-end="url(#flowArrow)"/>
              <path class="flow-edge" data-from="reflection" data-to="answer" d="M202 370 H230" marker-end="url(#flowArrow)"/>
            </g>

            <g class="flow-node" data-module="entry">
              <rect x="118" y="8" width="84" height="28" rx="8"/>
              <text x="160" y="26" data-i18n="flow.entry">Input</text>
            </g>
            <g class="flow-node" data-module="router">
              <rect x="118" y="56" width="84" height="28" rx="8"/>
              <text x="160" y="74" data-i18n="flow.router">Router</text>
            </g>
            <g class="flow-node" data-module="loop">
              <rect x="32" y="112" width="86" height="30" rx="8"/>
              <text x="75" y="131" data-i18n="flow.loop">Agent loop</text>
            </g>
            <g class="flow-node" data-module="capability">
              <rect x="202" y="112" width="92" height="30" rx="8"/>
              <text x="248" y="131" data-i18n="flow.capability">Capability</text>
            </g>
            <g class="flow-node" data-module="langgraph">
              <rect x="202" y="172" width="92" height="30" rx="8"/>
              <text x="248" y="191" data-i18n="flow.langgraph">LangGraph</text>
            </g>

            <g class="flow-node" data-module="coros">
              <rect x="202" y="230" width="92" height="30" rx="8"/>
              <text x="248" y="249" data-i18n="flow.coros">COROS MCP</text>
            </g>
            <g class="flow-node" data-module="profile">
              <rect x="16" y="184" width="86" height="30" rx="8"/>
              <text x="59" y="203" data-i18n="flow.profile">Profile</text>
            </g>
            <g class="flow-node" data-module="knowledge">
              <rect x="108" y="222" width="86" height="30" rx="8"/>
              <text x="151" y="241" data-i18n="flow.knowledge">RAG</text>
            </g>
            <g class="flow-node" data-module="search">
              <rect x="16" y="260" width="86" height="30" rx="8"/>
              <text x="59" y="279" data-i18n="flow.search">Search</text>
            </g>
            <g class="flow-node" data-module="observation">
              <rect x="106" y="268" width="108" height="30" rx="8"/>
              <text x="160" y="287" data-i18n="flow.observation">Observation</text>
            </g>
            <g class="flow-node" data-module="llm">
              <rect x="118" y="316" width="84" height="28" rx="8"/>
              <text x="160" y="334" data-i18n="flow.llm">LLM</text>
            </g>

            <g class="flow-node" data-module="reflection">
              <rect x="112" y="356" width="96" height="28" rx="8"/>
              <text x="160" y="374" data-i18n="flow.reflection">Reflect</text>
            </g>

            <g class="flow-node" data-module="answer">
              <rect x="230" y="356" width="72" height="28" rx="8"/>
              <text x="266" y="374" data-i18n="flow.answer">Answer</text>
            </g>
          </svg>
          <p class="flow-hint" id="flowHint" data-i18n="flow.hint">Nodes light up after you ask</p>
        </section>
      </aside>

      <section class="chat-shell">
        <div class="stage">
          <div class="thread" id="chatLog" aria-live="polite">
            <section class="welcome" id="welcome">
              <h2>COROS Running Agent</h2>
              <p data-i18n="chat.welcomeBody">This web console can read workouts, personal bests, running knowledge, and COROS archives. Write actions stay in Discord.</p>
            </section>
          </div>
        </div>

        <section class="composer-suggestions" data-i18n-aria="chat.suggestions" aria-label="Suggested questions">
          <div class="suggestions" id="suggestions"></div>
        </section>

        <form class="composer" id="chatForm">
          <label class="sr-only" for="messageInput" data-i18n="chat.message">Message</label>
          <textarea
            id="messageInput"
            rows="1"
            data-i18n-placeholder="chat.placeholder"
            placeholder="Ask a question, or click a suggested prompt above..."
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" data-i18n-aria="chat.send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </section>
    </main>

    <section class="activity-notice" id="activityNotice" hidden aria-live="polite">
      <div class="activity-notice-card" role="dialog" aria-modal="false" aria-labelledby="activityNoticeTitle">
        <button type="button" class="notice-close" id="activityNoticeDismiss" data-i18n-aria="notice.dismiss" aria-label="Dismiss workout notice">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <p class="notice-eyebrow" data-i18n="notice.eyebrow">New activity detected</p>
        <h2 id="activityNoticeTitle" data-i18n="notice.title">Completed workout</h2>
        <p id="activityNoticeMeta" data-i18n="notice.meta">Ready for AI review</p>
        <button type="button" class="notice-primary" id="activityNoticeInterpret" data-i18n="notice.interpret">Interpret</button>
      </div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
